# RT-750: UNPRIVILEGED half of the automatic cross-browser PR check. It builds the pull request's SPA and uploads
# `dist/` as an artifact, nothing else. It holds no secret, uses no environment and has a read-only token, because it
# runs the pull request's own code (package scripts, vite config). The BrowserStack run happens in
# cross-browser-cloud.yml, which GitHub starts from `main` (workflow_run) and which never executes this code: it only
# serves the built static files. Do not add secrets, an environment or a write permission here, and never switch the
# trigger to pull_request_target. Details: cloud-e2e/README.md.
name: Cross-browser PR build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # App build inputs only (what changes the built SPA). Test, doc and cloud-config edits do not start a run.
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

# A newer push to the same PR supersedes the older build before it can reach the cloud.
concurrency:
  group: cross-browser-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Draft PRs are skipped; marking one ready starts a run (ready_for_review).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the SPA
        run: pnpm build

      - name: Upload the built SPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
