# D-6: CI workflow shape. One workflow, install -> build -> lint -> test
# -> E2E per PR against main. Node 22 LTS (single pinned version, not a
# matrix), ubuntu-latest. CI runtime is NOT deployment runtime (FR-002-005).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs on the same ref to save CI minutes. Push runs on
# main get a per-SHA group so back-to-back merges each complete (RT-579).
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: the job only checks out and restores caches (RT-84).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # RT-584: default is 360 min; the job's p90 is ~2 min, so a hang fails fast.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # RT-584: the generated client is committed, so drift from the pinned
      # Backend-Core contract (hand edit, stale regen, generator bump) must fail
      # before merge. Pins come from openapi-ts.config.ts; no secret needed
      # (Backend-Core is public). Runs before Build so drift fails fast.
      - name: Fetch pinned Backend-Core contracts
        run: .github/scripts/fetch-pinned-contracts.sh "$RUNNER_TEMP/backend-core"

      - name: Regenerate API client
        run: pnpm generate:client
        env:
          DATA_PULSE_2_REPO: ${{ runner.temp }}/backend-core

      - name: Check API client is up to date
        run: |
          if ! git diff --exit-code --stat src/generated/; then
            echo "::error title=API client drift::src/generated/ differs from a regeneration at the pinned Backend-Core commit. Run 'pnpm generate:client' and commit the result."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # RT-461: informational coverage upload. Never gates the build: the step
      # is continue-on-error and fail_ci_if_error is false. Skipped for fork PRs
      # because repository secrets are unavailable to them.
      - name: Upload coverage to Codecov
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # RT-584: Playwright retries (2) hide flakes. Warn per test that passed
      # only on retry and list them in the step summary. Warn-only by policy.
      - name: Report E2E retries
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/report-flaky-e2e.mjs
          if [ -f playwright-report/e2e-retries.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < playwright-report/e2e-retries.md
          fi
