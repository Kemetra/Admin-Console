# RT-750: BrowserStack cross-browser SMOKE of the existing locale-switch E2E spec, on the official BrowserStack
# Node SDK with SDK-managed BrowserStack Local: Firefox/Windows 11 and Playwright WebKit/macOS Ventura, Arabic and
# English (about 4 sessions per run). Never a required check; the required Chromium CI (ci.yml) is untouched.
# Results: this run's summary (with links), a commit status on the PR head, and BrowserStack Test Reporting & Analytics.
#
# Two triggers, one trusted job:
#  - workflow_dispatch: manual, main only, builds the SPA from main.
#  - workflow_run: after the unprivileged "Cross-browser PR build" (cross-browser-pr-build.yml) finished for a
#    same-repo pull request. GitHub always starts a workflow_run workflow from the default branch, so a pull request
#    cannot edit this file, its `if:`, the spec, the config or the pins. The job checks out `main`, takes ONLY the
#    pull request's built static files from the artifact, and never runs pull-request code. Consequence: the cloud
#    run uses main's spec and fixtures against the PR's build. Test or cloud-config changes in a PR are therefore not
#    exercised before merge (run this workflow manually on main after merging them).
# Automatic runs are OFF until the repository variable BROWSERSTACK_PR_RUNS is 'true' (a cost switch, not a boundary).
# There is deliberately no pull_request or pull_request_target trigger here. Details: cloud-e2e/README.md.
name: Cross-browser cloud smoke

on:
  workflow_dispatch:
    inputs:
      acknowledge_entitlement:
        description: "I confirm this run may use the existing BrowserStack Open Source entitlement (no purchase or upgrade)"
        type: boolean
        required: true
        default: false
  workflow_run:
    workflows: ["Cross-browser PR build"]
    types: [completed]

permissions:
  contents: read

jobs:
  cloud-smoke:
    # Main only for the manual run (here and in the environment's deployment-branch policy, a repository setting).
    # Automatic run: only a successful PR build from THIS repository (a fork cannot spend the key) while the
    # BROWSERSTACK_PR_RUNS variable is on.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.acknowledge_entitlement && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' && vars.BROWSERSTACK_PR_RUNS == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    # One cloud run at a time (this bounds sessions across all pull requests); a running run is never cancelled and
    # GitHub keeps at most one pending, so a newer pending run replaces an older pending one. On the JOB, not the
    # workflow: a job skipped by the `if:` above (fork PR, failed or cancelled build) never takes a slot, so it cannot
    # evict a real pending run.
    concurrency:
      group: cross-browser-cloud
      cancel-in-progress: false
    runs-on: windows-latest
    environment: browserstack
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read      # download the PR build artifact
      statuses: write    # report the result on the PR head commit
    env:
      PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      STATUS_CONTEXT: Cross-browser cloud smoke
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the BrowserStack secrets exist (values are never printed)
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if (-not $env:BROWSERSTACK_USERNAME -or -not $env:BROWSERSTACK_ACCESS_KEY) {
            throw 'BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY are not set in the browserstack environment.'
          }

      # Automatic runs only. The SHA comes from the workflow_run event payload; it is validated, never interpolated
      # into a script.
      - name: Mark the PR commit as pending
        id: pending
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BUILD_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if ($env:PR_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'the PR head SHA is not a 40-character hex string' }
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:PR_HEAD_SHA" -f state=pending -f context="$env:STATUS_CONTEXT" -f description='Running on BrowserStack (Firefox, WebKit; ar, en)' -f target_url="$env:RUN_URL" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not set the pending commit status' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @("Pull request build: $env:PR_BUILD_URL", "Tested commit: $env:PR_HEAD_SHA (the PR's merge result with main, built from head; main's spec and config run against it)")

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The root install never sees the proprietary SDK: it is isolated in cloud-e2e/ (licence, Jira RT-750 13075).
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Manual run: build main. Automatic run: main's tooling never builds pull-request code (see the header).
      - name: Build the SPA (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm build

      # Outside the workspace on purpose. The files are untrusted data: they are only served, never executed here.
      - name: Download the PR build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-dist
          path: ${{ runner.temp }}/spa-dist
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Check the PR build is plain static files
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          SPA_DIR: ${{ runner.temp }}/spa-dist
        run: |
          if (-not (Test-Path -LiteralPath (Join-Path $env:SPA_DIR 'index.html'))) { throw 'the PR build has no index.html' }
          $files = @(Get-ChildItem -LiteralPath $env:SPA_DIR -Recurse -Force)
          if (@($files | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count -gt 0) { throw 'the PR build contains a link' }
          $bytes = ($files | Where-Object { -not $_.PSIsContainer } | Measure-Object Length -Sum).Sum
          if ($bytes -gt 100MB) { throw "the PR build is $([math]::Round($bytes / 1MB)) MB (limit 100 MB)" }

      - name: Install the SDK from cloud-e2e (own lockfile, no scripts)
        run: pnpm --dir cloud-e2e install --frozen-lockfile --ignore-scripts

      # One step on purpose: the preview server must live as long as both SDK runs. Per locale: write the official
      # browserstack.yml (no credential fields), run the SDK once, then check the results. Sessions are bounded by
      # cloud-e2e/playwright.config.ts (one worker per platform, no retries, maxFailures 2).
      - name: Cloud run - Arabic and English
        id: run
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          SPA_DIR: ${{ github.event_name == 'workflow_run' && format('{0}/spa-dist', runner.temp) || 'dist' }}
        run: |
          # Returns the problems found for one locale (empty = every configured platform ran and nothing failed).
          # The SDK can exit 0 without running a test, so "no results" is a failure here.
          function Test-Locale([string]$Locale, [int]$SdkExit, [int]$Platforms) {
            $problems = @()
            if ($SdkExit -ne 0) { $problems += "the SDK exited with code $SdkExit" }
            $json = "reports/$Locale/results.json"
            if (-not (Test-Path $json)) { return $problems + 'no results.json was produced (the SDK can exit 0 without running tests)' }
            $data = Get-Content -LiteralPath $json -Raw | ConvertFrom-Json -Depth 100
            $s = $data.stats
            if (($s.expected + $s.unexpected + $s.flaky) -lt 1) { $problems += 'no test was executed' }
            if ($s.unexpected -gt 0) { $problems += "$($s.unexpected) test(s) failed" }
            $tests = New-Object System.Collections.Generic.List[object]
            function Add-Tests($Suites) {
              foreach ($n in $Suites) {
                foreach ($sp in $n.specs) { foreach ($t in $sp.tests) { $tests.Add($t) } }
                if ($n.suites) { Add-Tests $n.suites }
              }
            }
            Add-Tests $data.suites
            $ran = @($tests | Where-Object { @($_.results | Where-Object { $_.status -ne 'skipped' }).Count -gt 0 } | ForEach-Object projectName | Sort-Object -Unique)
            if ($ran.Count -lt $Platforms) { $problems += "tests ran on only $($ran.Count) of $Platforms configured platform(s)" }
            return $problems
          }

          # The preview server serves files that may come from a pull request: it never gets the key in its environment.
          $bsUser = $env:BROWSERSTACK_USERNAME; $bsKey = $env:BROWSERSTACK_ACCESS_KEY
          Remove-Item Env:BROWSERSTACK_USERNAME, Env:BROWSERSTACK_ACCESS_KEY
          $preview = Start-Process node -PassThru -WindowStyle Hidden -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--port', '4173', '--strictPort', '--outDir', $env:SPA_DIR)
          $env:BROWSERSTACK_USERNAME = $bsUser; $env:BROWSERSTACK_ACCESS_KEY = $bsKey
          $failed = $false
          try {
            $up = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri 'http://localhost:4173/signin' -UseBasicParsing -TimeoutSec 3 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw 'preview did not start' }
            Set-Location cloud-e2e
            foreach ($locale in 'ar', 'en') {
              $build = "rt-admin-console-cloud-$locale"
              $env:E2E_LOCALE = $locale
              Remove-Item -LiteralPath "reports/$locale" -Recurse -Force -ErrorAction SilentlyContinue
              # Digit-free build name on purpose: TRA drops digit-bearing tokens from build names.
              $yml = @"
          framework: playwright
          projectName: Admin-Console
          buildName: $build
          platforms:
            - os: Windows
              osVersion: 11
              browserName: playwright-firefox
              browserVersion: latest
            - os: OS X
              osVersion: Ventura
              browserName: playwright-webkit
              browserVersion: latest
          parallelsPerPlatform: 1
          browserstackLocal: true
          testObservability: true
          selfHeal: false
          "@
              Set-Content -LiteralPath browserstack.yml -Value $yml
              pnpm exec browserstack-node-sdk playwright test --config playwright.config.ts 2>&1 | Tee-Object -Variable sdkOut | Out-Host
              $exit = $LASTEXITCODE
              $problems = @(Test-Locale $locale $exit ([regex]::Matches($yml, 'browserName:')).Count)
              $links = [regex]::Matches(($sdkOut | Out-String), 'https://automate\.browserstack\.com/dashboard/v2/builds/[0-9a-f]+|https://automation\.browserstack\.com/builds/[A-Za-z0-9]+') | ForEach-Object Value | Sort-Object -Unique
              $lines = @("### Locale $locale - build $build") + @($links | ForEach-Object { "- Results: $_" }) + "- SDK exit code: $exit"
              if ($problems.Count -gt 0) { $failed = $true; $lines += @($problems | ForEach-Object { "- FAILED: $_" }) } else { $lines += '- Result: every configured platform ran, no test failed' }
              $lines | ForEach-Object { Write-Host $_ }
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $lines
            }
          } finally {
            if ($preview -and -not $preview.HasExited) { Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($failed) { exit 1 }

      # Detective control: the SDK downloads and RUNS its CLI and BrowserStack Local with the key and offers no way to
      # verify them first, so they are verified after every run against .github/browserstack-pins.json (hash, valid
      # Authenticode signature, signer). Any other executable under ~/.browserstack also fails the job. A mismatch
      # with a VALID signature is most likely a vendor release: review it, then bump the pins in a reviewed PR.
      # A bad or missing signature means possible compromise: rotate the BrowserStack key.
      - name: Verify the vendor binaries after the run
        if: ${{ always() && steps.run.conclusion != 'skipped' }}
        run: |
          $pins = Get-Content -LiteralPath .github/browserstack-pins.json -Raw | ConvertFrom-Json
          $bad = @()
          $known = @()
          foreach ($b in @(@{ Path = $pins.local.relativePath; Hash = $pins.local.exeSha256; Signer = $pins.local.signer }, @{ Path = $pins.cli.relativePath; Hash = $pins.cli.sha256; Signer = $pins.cli.signer })) {
            $path = Join-Path $env:USERPROFILE $b.Path
            $known += $path
            if (-not (Test-Path -LiteralPath $path)) { $bad += "MISSING: $path"; continue }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            $signer = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            Write-Host "$path sha256=$hash signature=$($sig.Status) signer=$signer"
            if ($sig.Status -ne 'Valid' -or $signer -ne $b.Signer) { $bad += "SIGNATURE (possible compromise, rotate the key): $path" }
            elseif ($hash -ne $b.Hash.ToUpperInvariant()) { $bad += "HASH differs from the pin but the signature is valid (most likely a vendor release): $path" }
          }
          $stray = @(Get-ChildItem -LiteralPath (Join-Path $env:USERPROFILE '.browserstack') -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue | Where-Object { $known -notcontains $_.FullName })
          foreach ($f in $stray) { $bad += "UNPINNED executable: $($f.FullName)" }
          $lines = if ($bad.Count -gt 0) { @($bad | ForEach-Object { "- BINARY CHECK FAILED: $_" }) } else { @('- Vendor binaries re-verified after the run (hash, signature, signer match the pins)') }
          $lines | ForEach-Object { Write-Host $_ }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $lines
          if ($bad.Count -gt 0) { throw 'vendor binary check failed' }

      # The first run on GitHub left no logs (the Local log was lost): print the tails when anything failed.
      - name: Failure diagnostics
        if: ${{ failure() }}
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:USERPROFILE '.browserstack/log') -Filter 'local-*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "---- $($_.Name)"; Get-Content -LiteralPath $_.FullName -Tail 30
          }
          Get-ChildItem -Path cloud-e2e/log -File -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            Write-Host "---- $($_.Name)"; Get-Content -LiteralPath $_.FullName -Tail 20
          }

      # Automatic runs: the result must be visible on the PR, not only in this run. Posted last and always, so a red
      # run never leaves the commit pending. Never a required check.
      - name: Report the result on the PR commit
        if: ${{ always() && github.event_name == 'workflow_run' && steps.pending.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state, $text = switch ($env:JOB_STATUS) {
            'success'   { 'success', 'Passed on Firefox and WebKit, ar and en' }
            'cancelled' { 'error', 'Cancelled before a result' }
            default     { 'failure', 'Failed: see the run for the platform and locale' }
          }
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:PR_HEAD_SHA" -f state=$state -f context="$env:STATUS_CONTEXT" -f description="$text" -f target_url="$env:RUN_URL" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not set the final commit status' }
