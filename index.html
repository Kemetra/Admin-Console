<!doctype html>
<html lang="ar-EG" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم Retail Tower</title>
    <!-- RT-398: restore the dark theme before first paint (no light flash). The key
         must match THEME_LAST_KEY in src/theme/theme.ts. A future CSP needs this
         script's hash. -->
    <!-- RT-399: Arabic (rtl) is the default above; restore an English choice before
         first paint (no RTL flash). The key must match LOCALE_LAST_KEY in
         src/i18n/locale.ts. -->
    <script>
      try {
        if (localStorage.getItem("rt.theme.v1:last") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
        if (localStorage.getItem("rt.locale.v1:last") === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
          document.title = "Retail Tower Console";
        }
      } catch {
        // Storage can be blocked (private mode, site-data policy). Nothing to
        // recover: the page keeps its Arabic, light-theme defaults.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
