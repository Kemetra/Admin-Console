# RT-750: template for the generated cloud-e2e/browserstack.yml (gitignored). The workflow
# substitutes the two __PLACEHOLDERS__ per run. NO credential fields on purpose: the SDK reads
# BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY from the environment (GitHub Actions secrets).
framework: playwright
projectName: Admin-Console
# Digit-free on purpose: BrowserStack TRA drops digit-bearing tokens from build names.
buildName: __BUILD_NAME__
platforms:
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest
  - os: OS X
    osVersion: Ventura
    browserName: playwright-webkit
    browserVersion: latest
# One worker per platform: bounds sessions (see playwright.config.ts).
parallelsPerPlatform: 1
# The tunnel is started by the workflow from a hash- and signature-verified BrowserStackLocal
# binary; the SDK must not download or start its own.
browserstackLocal: true
browserStackLocalOptions:
  skipBinaryInitialisation: true
  localIdentifier: __LOCAL_ID__
# Per-test results in Test Reporting & Analytics.
testReporting: true
# Optional AI features stay off. (The Test Failure Analysis agent has no documented off switch.)
selfHeal: false
debug: false
networkLogs: false
consoleLogs: errors
