# SonarCloud automatic analysis settings.
#
# The Arabic and English message catalogs mirror each other key for key by
# design (English is typed against Arabic, RT-399), and copy-paste detection
# ignores string values, so every new key reads as duplicated code. Exclude
# the catalogs from duplication detection only; every other rule still applies.
sonar.cpd.exclusions=src/i18n/messages/**

# design_handoff_retail_tower_console is the design hand-off bundle (static
# HTML, CSS and prototype scripts). It is reference material, not shipped code,
# so its findings are noise. Exclude it from analysis.
sonar.exclusions=design_handoff_retail_tower_console/**
